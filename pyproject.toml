[project]
name = "kinetix"
version = "0.1.0"
description = "High-performance modular log generator for simulation and validation."
authors = [{ name = "Kinetix Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
